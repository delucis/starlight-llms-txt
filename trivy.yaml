---
# Governance-managed Trivy configuration.
#
# CVE suppressions live in .trivyignore (separate managed file).
# This file configures filesystem-scan behavior — specifically,
# directories that must never be walked.

# Tool-generated trees change during the same CI run. Python linters create
# dangling cache symlinks, while Rust Clippy replaces objects under nested target/ trees.
# Trivy's fs walker can hit those paths between creation and replacement,
# producing a FATAL "no such file or directory" and aborting the whole scan.
# Skipping these directories is safe: they contain no production
# artifacts — only scratch caches regenerated each run.
#
# See docs-control issues #377 and #1860.
scan:
  skip-dirs:
    - .mypy_cache
    - .ruff_cache
    - .pytest_cache
    - "**/target"
